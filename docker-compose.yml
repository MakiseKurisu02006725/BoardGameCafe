version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: boardgamecafe-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boardgamecafe-backend
    ports:
      - "5000:8080"
    depends_on:
      - db
    environment:
      - ConnectionStrings__Default=Server=db;Database=BoardGameCafe;User=sa;Password=Your_password123;TrustServerCertificate=true
      - ASPNETCORE_ENVIRONMENT=Production
      - JwtSettings__SecretKey=your-super-secret-key-32chars-plus
      - Hangfire__ConnectionString=Server=db;Database=BoardGameCafe;User=sa;Password=Your_password123;TrustServerCertificate=true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: boardgamecafe-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

volumes:
  sqldata:
