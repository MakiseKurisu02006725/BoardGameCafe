version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: boardgamecafe-db
    environment:
      - ACCEPT_EULA=Y
      # 密码通过根目录 .env 文件提供（DB_PASSWORD），禁止在仓库中提交明文
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boardgamecafe-backend
    ports:
      - "5000:8080"
    depends_on:
      - db
    environment:
      - ConnectionStrings__Default=Server=db;Database=BoardGameCafe;User=sa;Password=${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD};TrustServerCertificate=true
      - ASPNETCORE_ENVIRONMENT=Production
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:?请在 .env 中设置 JWT_SECRET_KEY}
      - Hangfire__ConnectionString=Server=db;Database=BoardGameCafe;User=sa;Password=${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD};TrustServerCertificate=true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: boardgamecafe-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

volumes:
  sqldata:
