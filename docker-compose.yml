version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: boardgamecafe-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boardgamecafe-backend
    ports:
      - "5000:8080"
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # 连接字符串键名必须与代码 GetConnectionString("DefaultConnection") / ("HangfireConnection") 完全一致
      - ConnectionStrings__DefaultConnection=Server=db;Database=BoardGameCafe;User=sa;Password=Your_password123;TrustServerCertificate=true;MultipleActiveResultSets=True
      - ConnectionStrings__HangfireConnection=Server=db;Database=BoardGameCafe;User=sa;Password=Your_password123;TrustServerCertificate=true
      # JWT 的 Issuer / Audience 是 Token 校验必填项，缺省会导致登录后令牌校验失败
      - JwtSettings__SecretKey=your-super-secret-key-32chars-plus-change-me
      - JwtSettings__Issuer=BoardGameCafe
      - JwtSettings__Audience=BoardGameCafeUsers
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: boardgamecafe-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

volumes:
  sqldata:
